# ==============================================================================
# Plugins
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'dracula/tmux'

# ==============================================================================
# Plugin configuration
# ==============================================================================

# dracula theme
set -g @dracula-plugins "time"
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-show-empty-plugins false
set -g @dracula-show-timezone false
set -g @dracula-time-format "%H:%M"

# resurrect
set -g @resurrect-capture-pane-contents 'on'

# continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-fzf trigger
TMUX_FZF_LAUNCH_KEY="F"

# ==============================================================================
# General settings
# ==============================================================================

# Set prefix to Ctrl-a
set -g prefix C-a
unbind C-b

# Send Ctrl-a to other apps (nested tmux, emacs, etc.)
bind C-a send-prefix

# Use fish as default shell
set -g default-shell /opt/homebrew/bin/fish

# True color support
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:RGB"

# Increase scrollback buffer
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# tmux messages displayed for 1 second
set -g display-time 1000

# Set base index for windows and panes to 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable vi keys in copy mode
setw -g mode-keys vi

# Mouse support on
set -g mouse on

# ==============================================================================
# Status bar
# ==============================================================================

set -g status on
set -g status-interval 5
set -g status-position bottom

# ==============================================================================
# Key bindings
# ==============================================================================

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split windows, keep current path
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom pane
unbind z
bind z resize-pane -Z

# Navigate windows
bind b previous-window

# Display panes
unbind w
bind w display-panes
set -g display-panes-time 4000

# Kill pane / window / session
bind q kill-pane
bind Q kill-window
unbind X
bind X confirm-before -p "kill-session #W? (y/n)" kill-session

# ==============================================================================
# Copy mode
# ==============================================================================

# Enter copy mode
unbind [
bind Escape copy-mode

# vi-style selection
bind -T copy-mode-vi v send -X begin-selection

# Yank to macOS clipboard
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy" \; display-message "Copied!"

# Paste
unbind ]
unbind p
bind p paste-buffer

# ==============================================================================
# Initialize TPM (keep at bottom)
# ==============================================================================
run '~/.tmux/plugins/tpm/tpm'
